[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hp437b-automation"
version = "0.1.0"
description = "Source-backed HP 437B control and CSV logging"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "lbussy"}]
dependencies = ["PyVISA==1.16.2", "PyVISA-py==0.8.1", "PyUSB==1.3.1"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4", "build==1.6.1"]

[project.scripts]
hp437b = "hp437b.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
