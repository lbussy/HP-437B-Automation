name: Software checks
on:
  push:
    branches: [devel]
  pull_request:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation -e .
      - run: ruff check src tests tools setup.py
      - run: ruff format --check src tests tools setup.py
      - run: python tools/offline_qa.py -- python -m pytest -q
      - run: python tools/offline_qa.py -- python -m build --no-isolation
      - run: git diff --check
  reporting:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    env:
      MPLCONFIGDIR: /tmp/hp437b-report-mpl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation -e '.[reports]'
      - run: python tools/offline_qa.py -- python -m pytest -q tests/test_reporting.py tests/test_pipeline.py tests/test_workflow_report.py tests/test_physical_workflow.py tests/test_report_sheet.py tests/test_report_identity.py tests/test_report_context.py tests/test_report_build.py tests/test_stability.py tests/test_stability_physical.py
